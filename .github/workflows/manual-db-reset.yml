name: Manual DB Reset (one-off)

# 수동으로 버튼을 눌러야만 실행됨 (push로는 절대 실행 안 됨)
on:
  workflow_dispatch:

jobs:
  reset:
    name: Reset OCI Database
    runs-on: ubuntu-latest
    steps:
      - name: Reset DB via SSH (prisma migrate reset --force)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/ubuntu/Backend
            sudo docker compose -f docker-compose.prod.yml exec -T api ./node_modules/.bin/prisma migrate reset --force --skip-generate
