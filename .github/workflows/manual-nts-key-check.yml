name: Manual Env Health Check (one-off)

# 수동으로 버튼을 눌러야만 실행됨 (push로는 절대 실행 안 됨)
on:
  workflow_dispatch:

jobs:
  check:
    name: Check server .env health
    runs-on: ubuntu-latest
    steps:
      - name: Inspect .env without printing secret values
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /home/ubuntu/Backend
            echo "=== .env 주요 값 상태 (값 자체는 출력 안 함) ==="
            for VAR in NODE_ENV DATABASE_URL REDIS_URL SMTP_HOST SMTP_USER SMTP_PASS SMTP_FROM NTS_API_KEY FRONTEND_URL JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
              VAL=$(grep "^$VAR=" .env | cut -d '=' -f2-)
              if [ -z "$VAL" ]; then
                echo "$VAR: (비어있음)"
              else
                # localhost/placeholder로 보이는지만 티나게, 값 자체는 앞 4글자+길이만
                PREFIX=$(echo "$VAL" | cut -c1-4)
                echo "$VAR: 설정됨 (길이 ${#VAL}, 시작: ${PREFIX}..., localhost포함여부: $(echo "$VAL" | grep -qi localhost && echo YES || echo no))"
              fi
            done

            echo ""
            echo "=== NTS_API_KEY 실동작 테스트 ==="
            KEY=$(grep '^NTS_API_KEY=' .env | cut -d '=' -f2-)
            if [ -z "$KEY" ]; then
              echo "RESULT: NTS_API_KEY is empty"
            else
              HTTP_CODE=$(curl -s -o /tmp/nts_response.json -w '%{http_code}' -X POST \
                "https://api.odcloud.kr/api/nts-businessman/v1/validate?serviceKey=${KEY}&returnType=JSON" \
                -H 'Content-Type: application/json' \
                -d '{"businesses":[{"b_no":"1234567890","start_dt":"20200101","p_nm":"test"}]}')
              echo "RESULT: HTTP status = $HTTP_CODE"
              echo "RESULT: response body ="
              cat /tmp/nts_response.json
              rm -f /tmp/nts_response.json
            fi

            echo ""
            echo "=== SMTP 연결 테스트 (로그인 시도만, 메일은 안 보냄) ==="
            SMTP_HOST_VAL=$(grep '^SMTP_HOST=' .env | cut -d '=' -f2-)
            SMTP_PORT_VAL=$(grep '^SMTP_PORT=' .env | cut -d '=' -f2-)
            SMTP_PORT_VAL=${SMTP_PORT_VAL:-587}
            if [ -z "$SMTP_HOST_VAL" ]; then
              echo "RESULT: SMTP_HOST is empty"
            else
              timeout 5 bash -c "cat < /dev/null > /dev/tcp/${SMTP_HOST_VAL}/${SMTP_PORT_VAL}" && \
                echo "RESULT: ${SMTP_HOST_VAL}:${SMTP_PORT_VAL} 포트 연결 성공 (네트워크상 도달 가능)" || \
                echo "RESULT: ${SMTP_HOST_VAL}:${SMTP_PORT_VAL} 연결 실패"
            fi

            echo ""
            echo "=== 실행 중인 컨테이너 환경변수 확인 (컨테이너에 실제로 주입된 값 기준) ==="
            sudo docker compose -f docker-compose.prod.yml exec -T api printenv NODE_ENV FRONTEND_URL 2>&1 || echo "컨테이너 조회 실패"
